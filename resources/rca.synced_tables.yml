# Lakebase synced tables: Delta (netmon_rca.element_status / open_incidents, Change Data Feed on) -> Postgres
# database `netmon_serving` on the Lakebase instance, schema `netmon_rca`. TRIGGERED: the scoring job starts a
# sync after every MERGE (notebooks/04_rca_score_live.py). Registered in the project catalog because this
# workspace cannot create a Lakebase database catalog (no CREATE CATALOG on the metastore).
resources:
  synced_database_tables:
    lb_element_status:
      name: ${var.catalog}.${resources.schemas.netmon_rca.name}.lb_element_status
      database_instance_name: ${resources.database_instances.netmon_lakebase.name}
      logical_database_name: ${var.lakebase_database}
      spec:
        source_table_full_name: ${var.catalog}.${resources.schemas.netmon_rca.name}.element_status
        primary_key_columns: [element_id]
        scheduling_policy: TRIGGERED
        create_database_objects_if_missing: true
        new_pipeline_spec:
          storage_catalog: ${var.catalog}
          storage_schema: ${resources.schemas.netmon_rca.name}
    lb_open_incidents:
      name: ${var.catalog}.${resources.schemas.netmon_rca.name}.lb_open_incidents
      database_instance_name: ${resources.database_instances.netmon_lakebase.name}
      logical_database_name: ${var.lakebase_database}
      spec:
        source_table_full_name: ${var.catalog}.${resources.schemas.netmon_rca.name}.open_incidents
        primary_key_columns: [incident_id]
        scheduling_policy: TRIGGERED
        create_database_objects_if_missing: true
        new_pipeline_spec:
          storage_catalog: ${var.catalog}
          storage_schema: ${resources.schemas.netmon_rca.name}

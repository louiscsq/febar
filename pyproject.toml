[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netmon-datagen"
version = "0.1.0"
description = "Synthetic mobile-network telemetry generator (topology, KPIs, alarms, sessions, faults) for NOC monitoring demos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
# step 3 (RCA model, Lakebase); pyspark only for the local Spark test of the shared window transforms
rca = ["scikit-learn>=1.6", "mlflow-skinny>=3", "databricks-sdk>=0.81", "psycopg[binary]>=3.2"]
# step 4 (Gen AI assistant): structured outputs and MLflow GenAI evaluation / tracing
genai = ["pydantic>=2", "mlflow[databricks]>=3.4", "databricks-sdk>=0.81"]
spark-tests = ["pyspark>=4.0,<4.1"]
# step 5 (Databricks App, app/): what app/requirements.txt installs on the app, plus the test client
app = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "psycopg[binary]>=3.2", "psycopg-pool>=3.2",
       "databricks-sdk>=0.81", "pydantic>=2"]

[project.scripts]
netmon-datagen = "netmon_datagen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# versioned prompt text of the step-4 assistant (netmon_pipeline/genai/prompts/*.md)
"netmon_pipeline.genai" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["netmon_datagen", "netmon_pipeline", "noc_app", "conftest", "app_fakes"]

[tool.ruff.lint.per-file-ignores]
# Databricks source notebooks: `spark`/`dbutils` globals, imports after %pip, cell-display expressions.
"notebooks/*.py" = ["E402", "F821", "I001", "B018"]
# Lakeflow pipeline sources and governance notebooks: `spark`/`dbutils` globals, imports after sys.path setup.
"pipelines/**/*.py" = ["E402", "F821", "I001"]
"governance/*.py" = ["E402", "F821", "I001", "B018"]
